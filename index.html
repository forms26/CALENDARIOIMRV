<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Calendario de Servicio · Refugio de Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#0f0d09; --s2:#181510; --s3:#221e16;
  --line:rgba(217,178,92,.24); --line2:rgba(217,178,92,.5);
  --gold:#d9b25c; --gold-hi:#f6e7a1; --gold-lo:#b8862b;
  --grad:linear-gradient(100deg,#b8862b 0%,#f6e7a1 52%,#c9993a 100%);
  --txt:#f2ead2; --mut:#a39a80; --bad:#e58468; --ok:#9bcf93;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 var(--sans);min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.15}
.gold{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- entrada ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;gap:6px}
#login img{width:min(300px,72vw);height:auto;display:block}
#login h1{font-size:2rem;margin-top:8px;text-align:center}
#login p{color:var(--mut);margin:6px 0 22px;text-align:center}
#login form{width:min(340px,100%);display:grid;gap:14px}
.campo{display:grid;gap:6px}
.campo label,.lbl{font-size:.9rem;color:var(--mut)}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select{
  width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:46px}
input:focus,select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(217,178,92,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.rec{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:.95rem}
.rec input{width:20px;height:20px;accent-color:var(--gold)}
.error{color:var(--bad);min-height:1.4em;font-size:.95rem;text-align:center}

/* ---------- botones ---------- */
.btn{border:1px solid var(--line2);background:transparent;color:var(--gold-hi);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(217,178,92,.1)}
.btn.pri{background:var(--grad);color:#120d02;border-color:transparent}
.btn.pri:hover{filter:brightness(1.07);background:var(--grad)}
.btn.peligro{border-color:rgba(229,132,104,.55);color:var(--bad)}
.btn.peligro:hover{background:rgba(229,132,104,.1)}
.btn.ancho{width:100%}
.link{background:none;border:0;color:var(--gold);padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--gold-hi);font-size:1.3rem;line-height:1;display:grid;place-items:center;flex:none}
.ico:hover{border-color:var(--gold)}

/* ---------- cabecera ---------- */
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:#000;position:sticky;top:0;z-index:20}
.top img{height:58px;width:auto;display:block}
.top h1{font-size:1.45rem;flex:1;min-width:0}
.top .der{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.est{border:0;background:none;font-size:.85rem;color:var(--mut);padding:6px 8px;display:flex;align-items:center;gap:7px}
.est::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok)}
.est.guardando::before{background:var(--gold)}
.est.error::before,.est.conflicto::before{background:var(--bad)}
.est.error,.est.conflicto{color:var(--bad);text-decoration:underline}
.demo{background:var(--s3);color:var(--gold-hi);font-size:.88rem;text-align:center;padding:6px 12px}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#000;position:sticky;top:74px;z-index:19;padding:0 8px;overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:13px 12px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;min-height:48px}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}

/* ---------- calendario ---------- */
.barra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.barra h2{font-size:1.9rem}
.mes{display:flex;align-items:center;gap:10px}
.mes h2{min-width:9.5ch;text-align:center}
.sub{color:var(--mut);font-size:.95rem}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:10px 18px;min-height:44px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--grad);color:#120d02}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.vacio-m{border:1px dashed var(--line2);border-radius:14px;padding:28px 20px;text-align:center;color:var(--mut)}
.vacio-m b{color:var(--txt)}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));align-items:start}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px}
.card.esp{border-color:var(--line2);box-shadow:inset 0 3px 0 var(--gold)}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card .dia{color:var(--gold);font-size:.95rem;font-weight:600}
.card h3{font-size:1.3rem;margin-top:1px}
.card .tag{display:inline-block;margin-left:8px;font-family:var(--sans);font-size:.78rem;color:#120d02;background:var(--grad);padding:1px 8px;border-radius:99px;vertical-align:middle;font-weight:600}
.fila{display:grid;grid-template-columns:116px 1fr;gap:10px;padding:8px 0;border-top:1px solid rgba(217,178,92,.12);align-items:start}
.lab{color:var(--mut);font-size:.92rem;padding-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--s2);border-radius:99px;padding:6px 13px;min-height:40px;color:var(--txt)}
.chip:hover{border-color:var(--gold-hi)}
.chip.vacio{border-style:dashed;color:var(--mut);background:transparent}
.chip.warn{border-color:var(--bad)}
.chip.tog{color:var(--mut)}
.chip.tog.on{background:var(--grad);color:#120d02;border-color:transparent;font-weight:600}
.chip.ch{display:inline-flex;align-items:center;gap:8px;cursor:default}
.chip.ch button{background:none;border:0;color:var(--gold);padding:0 2px;font-size:1.05rem}

/* ---------- servidores y áreas ---------- */
.filtros{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-bottom:14px}
@media(max-width:560px){.filtros{grid-template-columns:1fr}}
.lista{display:grid;gap:8px}
.srv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.srv:hover{border-color:var(--gold)}
.srv .n{font-weight:600;font-size:1.05rem}
.srv .c{color:var(--mut);font-size:.88rem;text-align:right;align-self:center}
.srv .tags{grid-column:1/-1;color:var(--mut);font-size:.88rem}
.srv.off .n{color:var(--mut)}
.pie-sec{margin-top:26px;text-align:center}
.area-f{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.area-f .n{font-weight:600}
.area-f .m{color:var(--mut);font-size:.88rem}
.area-f .bt{display:flex;gap:6px}
.area-f .bt .ico{width:40px;height:40px;font-size:1rem}

/* ---------- ventana ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line2);border-radius:18px 18px 0 0}
@media(min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:16px;max-height:88vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.sh-h h3{font-size:1.45rem}
.sh-h .s{color:var(--mut);font-size:.92rem;font-family:var(--sans);font-weight:400;margin-top:2px}
.sh-b{padding:4px 18px 16px;overflow:auto;display:grid;gap:16px;align-content:start}
.sh-f{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-f .btn{flex:1;min-width:120px}
.cand{display:grid;grid-template-columns:1fr;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;min-height:52px}
.cand:hover{border-color:var(--gold)}
.cand .n{font-weight:600}
.cand .m{color:var(--mut);font-size:.88rem}
.cand.nd .m{color:var(--bad)}
.radio{display:flex;gap:12px;align-items:flex-start;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.radio input{margin-top:5px;accent-color:var(--gold);width:18px;height:18px}
.radio small{display:block;color:var(--mut)}
.hab{display:grid;grid-template-columns:auto 1fr 130px;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hab input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.hab select{min-height:40px;padding:6px 30px 6px 10px}
.apoyo{color:var(--mut);font-size:.95rem;margin:0}
.falt{margin:0;padding-left:18px;color:var(--bad);font-size:.95rem}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:99px;z-index:80;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ---------- impresión ---------- */
#print{display:none}
@page{size:landscape;margin:9mm}
@media print{
  body{background:#fff;color:#000}
  #app,#login,#modal,#toast{display:none!important}
  #print{display:block}
  #print h1{font-size:20pt;color:#000;margin:0}
  #print p{margin:2pt 0 8pt;font-size:10pt;color:#333}
  #print table{width:100%;border-collapse:collapse;font-size:8.5pt}
  #print th,#print td{border:1px solid #777;padding:3pt 4pt;text-align:center;vertical-align:middle}
  #print th{background:#e4e0d6}
  #print td:first-child{text-align:left;white-space:nowrap}
  #print tr.esp td{background:#f4e2b8}
  #print td.na{background:#cfcfcf}
  #print tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:480px){
  .fila{grid-template-columns:1fr;gap:2px}
  .lab{padding-top:2px}
  .top img{height:48px}
  .top h1{font-size:1.15rem}
  .tabs{top:64px}
}
</style>
</head>
<body>

<div id="login" hidden>
  <img id="logo-l" alt="Iglesia Misionera Refugio de Vida">
  <h1 class="gold">Calendario de servicio</h1>
  <p>Escribe la clave para entrar.</p>
  <form id="f-login" autocomplete="off">
    <div class="campo">
      <label for="clave">Clave</label>
      <input id="clave" type="password" autocomplete="current-password" required>
    </div>
    <label class="rec"><input id="recordar" type="checkbox" checked> Recordar en este dispositivo</label>
    <div class="error" id="login-error" role="alert"></div>
    <button class="btn pri ancho" type="submit" id="btn-entrar">Entrar</button>
  </form>
</div>

<div id="app" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parse = f => { const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaCorta = f => { const d = parse(f); return DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); };
const fechaLarga = f => { const d = parse(f); return DIAS_L[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const tituloMes = ym => { const [y, m] = ym.split('-').map(Number); return cap(MESES[m - 1]) + ' ' + y; };
const mesMas = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };

function seed() {
  const areas = SEED_AREAS.map(([id, nombre, vista, cupo]) => ({ id, nombre, vista, cupo }));
  const todas = areas.map(a => a.id);
  const tipos = SEED_TIPOS.map(([id, nombre, dia, as]) => ({ id, nombre, dia, areas: as === 'todas' ? todas.slice() : as.split(',') }));
  const servidores = SEED_SERV.split('\n').map((l, i) => { const [nombre, as] = l.split('|'); return { id: 's' + (i + 1), nombre, activo: true, areas: as.split(',') }; });
  return { rev: 0, areas, tipos, servidores, reuniones: [], asig: {}, nodisp: [] };
}

function normalizar(d) {
  const asig = {};
  (d.asignaciones || []).forEach(a => { if (a.ids && a.ids.length) asig[a.reunionId + '|' + a.areaId] = a.ids.slice(); });
  return {
    rev: d.rev || 0,
    areas: (d.areas || []).map(a => ({ id: a.id, nombre: a.nombre, vista: a.vista || 'servicio', cupo: Number(a.cupo) || 1 })),
    servidores: (d.servidores || []).map(s => ({ id: s.id, nombre: s.nombre, activo: s.activo !== false, areas: s.areas || [] })),
    tipos: (d.tipos || []).map(t => ({ id: t.id, nombre: t.nombre, dia: (t.dia === '' || t.dia == null) ? null : Number(t.dia), areas: t.areas || [] })),
    reuniones: (d.reuniones || []).map(r => ({ id: r.id, fecha: r.fecha, nombre: r.nombre, tipoId: r.tipoId || '', areas: r.areas || [], especial: !!r.especial })),
    asig,
    nodisp: (d.nodisp || []).map(n => ({ s: n.servidorId, f: n.fecha }))
  };
}

function datos() {
  return {
    areas: S.areas, servidores: S.servidores, tipos: S.tipos, reuniones: S.reuniones,
    asignaciones: Object.entries(S.asig).filter(([, v]) => v.length).map(([k, ids]) => { const [reunionId, areaId] = k.split('|'); return { reunionId, areaId, ids }; }),
    nodisp: S.nodisp.map(n => ({ servidorId: n.s, fecha: n.f }))
  };
}

function contarMes(ym) {

/* ---------- guardado ---------- */
let estado = 'ok', saving = false, dirty = false, timer = null;
const TXT_EST = { ok: 'Guardado', guardando: 'Guardando…', error: 'No se pudo guardar. Toca para reintentar', conflicto: 'Hay cambios nuevos de otra persona. Toca para actualizar' };
function setEstado(e) {
  estado = e;
  const el = $('#estado');
  if (el) { el.className = 'est ' + e; el.textContent = TXT_EST[e]; }
}
function touch() { dirty = true; setEstado('guardando'); clearTimeout(timer); timer = setTimeout(flush, 600); }
async function flush() {
  if (saving || !dirty) return;
  saving = true; dirty = false;
  try {
    if (!API_URL) {
      localStorage.setItem('imrv_demo', JSON.stringify(S));
      setEstado('ok');
    } else {
      const r = await api('guardar', { rev: S.rev, data: datos() });
      if (r.ok) { S.rev = r.rev; setEstado(dirty ? 'guardando' : 'ok'); }
      else if (r.error === 'conflicto') { setEstado('conflicto'); dirty = false; }
      else if (r.error === 'clave') { salir(); return; }
      else throw new Error(r.error || 'error');
    }
  } catch (e) { dirty = true; setEstado('error'); saving = false; return; }
  saving = false;
  if (dirty) flush();
}
async function api(accion, extra) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ accion, clave: CLAVE }, extra || {})) });
  return res.json();
}
async function recargar() {
  try {
    const r = await api('cargar');
    if (!r.ok) throw new Error(r.error);
    S = normalizar(r.data); S.rev = r.data.rev || 0;
    dirty = false; setEstado('ok'); render();
  } catch (e) { toast('No se pudo actualizar. Revisa tu internet.'); }
}
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !API_URL || !S || dirty || saving || !$('#modal').hidden) return;
  try {
    const r = await api('cargar');
    if (r.ok && (r.data.rev || 0) !== S.rev) { S = normalizar(r.data); S.rev = r.data.rev || 0; render(); }
  } catch (e) { /* sin conexión: se ignora */ }
});

/* ---------- entrada / salida ---------- */
async function hashHex(s) {
  if (!(window.crypto && crypto.subtle)) return null;
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function entrar(clave, recordar) {
  if (API_URL) {
    CLAVE = clave;
    const r = await api('cargar');
    if (!r.ok) throw new Error(r.error === 'clave' ? 'clave' : 'red');
    S = normalizar(r.data); S.rev = r.data.rev || 0;
    if (!S.areas.length) { const rev = S.rev; S = seed(); S.rev = rev; touch(); }
  } else {
    const h = await hashHex(clave);
    if (h !== null && h !== HASH_DEMO) throw new Error('clave');
    const raw = localStorage.getItem('imrv_demo');
    S = raw ? JSON.parse(raw) : seed();
    if (!raw) touch();
  }
  if (recordar) { try { localStorage.setItem('imrv_clave', clave); } catch (e) {} }
  $('#login').hidden = true; $('#app').hidden = false;
  render();
}
function salir() {
  try { localStorage.removeItem('imrv_clave'); } catch (e) {}
  CLAVE = ''; S = null;
  $('#app').hidden = true; $('#login').hidden = false; $('#clave').value = '';
  cerrar();
}
$('#f-login').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btn-entrar'), er = $('#login-error');
  er.textContent = ''; b.disabled = true; b.textContent = 'Entrando…';
  try { await entrar($('#clave').value.trim(), $('#recordar').checked); }
  catch (err) { er.textContent = err.message === 'clave' ? 'La clave no es correcta. Revísala e intenta de nuevo.' : 'No se pudo conectar. Revisa tu internet e intenta de nuevo.'; }
  b.disabled = false; b.textContent = 'Entrar';
});

function pintarSlot(mant) {
  const { r: rid, a: aid, todos } = ui.slot;
  const r = reu(rid), a = area(aid);
  if (!r || !a) return cerrar();
  const k = rid + '|' + aid, cur = S.asig[k] || [];

  const cands = S.servidores.filter(s => s.activo && !cur.includes(s.id) && (todos || s.areas.includes(aid)))
    .map(s => ({ s, nd: esNoDisp(s.id, r.fecha), otra: areaEnReunion(s.id, rid, aid), n: cont[s.id] || 0 }))
    .sort((x, y) => (x.nd - y.nd) || (!!x.otra - !!y.otra) || (x.n - y.n) || x.s.nombre.localeCompare(y.s.nombre));
  const quienes = cur.length ? `<div><div class="lbl">Asignados (toca ✕ para quitar)</div><div class="chips" style="margin-top:6px">${cur.map(id => `<span class="chip ch">${esc(nombreDe(id))}<button data-act="quitarSlot" data-s="${id}" aria-label="Quitar a ${esc(nombreDe(id))}">✕</button></span>`).join('')}</div></div>` : '';

  abrir(a.nombre, `${quienes}<div><div class="lbl">Elegir a quién agregar (primero quienes han servido menos)</div></div><div class="lista">${lista}</div>

  const f = ui.form, t = tipo(f.tipoId);
  if (!t) return;
  f.nombre = t.nombre; f.areas = t.areas.slice(); f.especial = t.id === 'esp';
  if (!f.id && t.dia != null && !f.fechaTocada) {
    // sugiere la próxima fecha con el día de la semana habitual dentro del mes visible
    const [y, m] = ui.mes.split('-').map(Number);
    for (let d = 1; d <= 31; d++) { const x = new Date(y, m - 1, d); if (x.getMonth() !== m - 1) break; if (x.getDay() === t.dia && ymd(x) >= fechaSug()) { f.fecha = ymd(x); break; } }
  }
  pintarFormReu();
}
function guardarReu() {
  const f = ui.form;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.fecha)) return toast('Elige la fecha de la reunión.');
  const t = tipo(f.tipoId);
  const nombre = (f.nombre || '').trim() || (t ? t.nombre : '');
  if (!nombre) return toast('Escribe el nombre de la reunión.');
  if (!f.areas.length) return toast('Elige al menos un área.');
  if (f.id) {
    const r = reu(f.id);
    S.areas.forEach(a => { if (!f.areas.includes(a.id)) delete S.asig[r.id + '|' + a.id]; });
    Object.assign(r, { fecha: f.fecha, nombre, tipoId: f.tipoId, areas: f.areas, especial: f.especial });
  } else {
    S.reuniones.push({ id: uid('r'), fecha: f.fecha, nombre, tipoId: f.tipoId, areas: f.areas, especial: f.especial });
  }
  ui.mes = f.fecha.slice(0, 7);
  touch(); cerrar(); render(); toast('Reunión guardada.');
}
function borrarReu() {
  const r = reu(ui.form.id);
  if (!confirm('¿Eliminar “' + r.nombre + '” del ' + fechaCorta(r.fecha) + '? Se pierde también quién estaba asignado.')) return;
  S.areas.forEach(a => delete S.asig[r.id + '|' + a.id]);
  S.reuniones = S.reuniones.filter(x => x.id !== r.id);
  touch(); cerrar(); render(); toast('Reunión eliminada.');
}

/* --- reuniones habituales --- */
function formHab() {
  const filas = S.tipos.filter(t => t.id !== 'esp').map(t => `<div class="hab"><input type="checkbox" data-hab="${t.id}" id="h-${t.id}"${['ens', 'g1', 'g2', 'ora'].includes(t.id) ? ' checked' : ''} aria-label="${esc(t.nombre)}">
      <label for="h-${t.id}">${esc(t.nombre)}</label>
      <select data-hdia="${t.id}" aria-label="Día de la semana de ${esc(t.nombre)}">${DIAS_L.map((d, i) => `<option value="${i}"${(t.dia ?? 0) === i ? ' selected' : ''}>${d}</option>`).join('')}</select></div>`).join('');
  abrir('Reuniones habituales', `<p class="apoyo">Marca las que se repiten cada semana y se agregan todas las fechas de ${tituloMes(ui.mes)}. Las que ya existen no se repiten.</p>${filas}`,
    `<button class="btn pri" data-act="doHab">Agregar al mes</button><button class="btn" data-act="cerrar">Cancelar</button>`);
}
function doHab() {
  const [y, m] = ui.mes.split('-').map(Number);
  let n = 0;
  S.tipos.filter(t => t.id !== 'esp').forEach(t => {
    if (!$('[data-hab="' + t.id + '"]').checked) return;
    const dia = Number($('[data-hdia="' + t.id + '"]').value);
    for (let d = 1; d <= 31; d++) {
      const x = new Date(y, m - 1, d); if (x.getMonth() !== m - 1) break;
      if (x.getDay() !== dia) continue;
      const f = ymd(x);
      if (S.reuniones.some(r => r.tipoId === t.id && r.fecha === f)) continue;
      S.reuniones.push({ id: uid('r'), fecha: f, nombre: t.nombre, tipoId: t.id, areas: t.areas.slice(), especial: false }); n++;
    }
  });
  cerrar(); if (n) touch(); render(); toast(n ? 'Se agregaron ' + n + ' reuniones.' : 'No había reuniones nuevas por agregar.');
}

/* --- generar --- */
function formGenerar() {
  ui.kind = 'gen'; ui.form = { modo: 'vacios' };
  const n = reunionesVista().length;
  abrir('Generar calendario', `<p class="apoyo">Se reparte a los servidores por turnos entre las ${n} reuniones de ${tituloMes(ui.mes)} (${ui.vista === 'servicio' ? 'Servicio' : 'Alabanza'}). Se respetan las áreas de cada persona y los días que marcaron como no disponibles, y quienes han servido menos pasan primero.</p>
    <label class="radio"><input type="radio" name="modo" value="vacios" data-f="modo" checked><span><b>Solo llenar los espacios vacíos</b><small>Mantiene lo que ya está puesto. Úsalo después de agregar un culto especial o a alguien nuevo.</small></span></label>
    <label class="radio"><input type="radio" name="modo" value="todo" data-f="modo"><span><b>Rehacer todo</b><small>Borra lo que está puesto en esta vista y arma el mes desde cero.</small></span></label>`,
    `<button class="btn pri" data-act="doGenerar"${n ? '' : ' disabled'}>Generar</button><button class="btn" data-act="cerrar">Cancelar</button>`);
}
function sirveDia(sid, fecha, exceptRid) {
  return S.reuniones.some(x => x.fecha === fecha && x.id !== exceptRid && S.areas.some(a => (S.asig[x.id + '|' + a.id] || []).includes(sid)));
}
function generar(modo) {
  const ym = ui.mes, vista = ui.vista, prev = mesMas(ym, -1);
  const rs = S.reuniones.filter(r => r.fecha.slice(0, 7) === ym).sort(cmpReu);
  if (modo === 'todo') rs.forEach(r => S.areas.forEach(a => { if (enVista(a, vista)) delete S.asig[r.id + '|' + a.id]; }));
  const cnt = {}, last = {};
  const mapa = Object.fromEntries(S.reuniones.map(r => [r.id, r]));
  for (const [k, ids] of Object.entries(S.asig)) {
    const r = mapa[k.split('|')[0]]; if (!r) continue;
    const m = r.fecha.slice(0, 7);
    if (m === prev || m === ym) ids.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; if (!last[id] || r.fecha > last[id]) last[id] = r.fecha; });
  }
  let llenados = 0; const faltas = {};
  for (const r of rs) {
    const usados = new Set();
    S.areas.forEach(a => (S.asig[r.id + '|' + a.id] || []).forEach(id => usados.add(id)));
    const elegibles = a => S.servidores.filter(s => s.activo && s.areas.includes(a.id) && !esNoDisp(s.id, r.fecha));
    const tareas = areasDeReu(r, vista).map(a => ({ a, falta: a.cupo - (S.asig[r.id + '|' + a.id] || []).length })).filter(t => t.falta > 0);
    tareas.forEach(t => { t.n = elegibles(t.a).length; });
    tareas.sort((x, y) => x.n - y.n);                      // primero las áreas con menos gente disponible
    for (const t of tareas) {
      const key = r.id + '|' + t.a.id;
      for (let i = 0; i < t.falta; i++) {
        const pool = elegibles(t.a).filter(s => !usados.has(s.id))
          .map(s => ({ s, p: (cnt[s.id] || 0) + (sirveDia(s.id, r.fecha, r.id) ? 0.6 : 0), rnd: Math.random() }));
        if (!pool.length) { faltas[t.a.nombre] = (faltas[t.a.nombre] || 0) + 1; continue; }
        pool.sort((x, y) => x.p - y.p || (last[x.s.id] || '').localeCompare(last[y.s.id] || '') || x.rnd - y.rnd);
        const el = pool[0].s;
        (S.asig[key] = S.asig[key] || []).push(el.id);
        usados.add(el.id); cnt[el.id] = (cnt[el.id] || 0) + 1; last[el.id] = r.fecha; llenados++;
      }
    }
  }
  touch();
  return { llenados, faltas };
}
function resultadoGenerar(res) {
  const f = Object.entries(res.faltas);
  const total = f.reduce((s, [, n]) => s + n, 0);
  abrir(total ? 'Calendario generado, con espacios por cubrir' : 'Calendario generado',
    `<p>Se asignaron <b>${res.llenados}</b> espacios${total ? ` y quedaron <b>${total}</b> vacíos por falta de servidores disponibles:` : '.'}</p>
     ${total ? `<ul class="falt">${f.map(([n, c]) => `<li>${esc(n)}: ${c}</li>`).join('')}</ul><p class="apoyo">Puedes agregar gente en la pestaña Servidores o asignar a alguien de otra área tocando el espacio vacío.</p>` : '<p class="apoyo">Revisa el calendario y toca cualquier nombre para cambiarlo.</p>'}`,
    `<button class="btn pri" data-act="cerrar">Ver calendario</button>`);
}

/* --- compartir --- */
function textoMes() {
  let t = `*Calendario de ${ui.vista === 'servicio' ? 'Servicio' : 'Alabanza'} – ${tituloMes(ui.mes)}*\nIglesia Misionera Refugio de Vida\n`;
  reunionesVista().forEach(r => {
    t += `\n*${cap(fechaCorta(r.fecha))} – ${r.nombre}*\n`;
    areasDeReu(r).forEach(a => { t += `• ${a.nombre}: ${(S.asig[r.id + '|' + a.id] || []).map(nombreDe).join(', ') || '—'}\n`; });
  });
  return t;
}
async function copiar() {
  const t = textoMes();
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch (e2) {} x.remove(); }
  cerrar(); toast('Texto copiado. Pégalo en WhatsApp.');
}
function imprimir() {
  const rs = reunionesVista();
  const cols = S.areas.filter(a => enVista(a) && rs.some(r => r.areas.includes(a.id)));
  let h = `<h1>Calendario de Organización · ${tituloMes(ui.mes)}</h1><p>Iglesia Misionera Refugio de Vida · ${ui.vista === 'servicio' ? 'Servicio' : 'Alabanza'}</p>
    <table><thead><tr><th>Fecha</th>${cols.map(c => `<th>${esc(c.nombre)}</th>`).join('')}</tr></thead><tbody>`;
  rs.forEach(r => {
    h += `<tr class="${r.especial ? 'esp' : ''}"><td><b>${esc(r.nombre)}</b><br>${fechaLarga(r.fecha)}</td>` + cols.map(c => r.areas.includes(c.id)
      ? '<td>' + (S.asig[r.id + '|' + c.id] || []).map(id => esc(nombreDe(id))).join('<br>') + '</td>' : '<td class="na"></td>').join('') + '</tr>';
  });
  $('#print').innerHTML = h + '</tbody></table>';
  cerrar(); setTimeout(() => window.print(), 80);
}

/* --- servidores --- */
function formSrv(id) {
  const s = id ? srv(id) : null;
  ui.kind = 'srv';
  ui.form = s ? { id: s.id, nombre: s.nombre, activo: s.activo, areas: s.areas.slice(), nodisp: S.nodisp.filter(n => n.s === s.id).map(n => n.f).sort(), nuevaFecha: '' }
              : { id: null, nombre: '', activo: true, areas: ui.fa ? [ui.fa] : [], nodisp: [], nuevaFecha: '' };
  pintarFormSrv();
}
function pintarFormSrv(mant) {
  const f = ui.form;
  abrir(f.id ? 'Editar servidor' : 'Agregar servidor', `
    <div class="campo"><label for="s-nombre">Nombre</label><input id="s-nombre" type="text" data-f="nombre" value="${esc(f.nombre)}" placeholder="Por ejemplo: Ana C."></div>
    <div><div class="lbl">Áreas en las que puede servir</div><div class="chips" style="margin-top:8px">${chipsAreas(f.areas)}</div></div>
    <label class="rec"><input type="checkbox" data-f="activo"${f.activo ? ' checked' : ''}> Está sirviendo actualmente (si lo quitas, no se le asignará nada)</label>
    <div><div class="lbl">Fechas en que no puede</div>
      <div class="chips" style="margin:8px 0">${f.nodisp.length ? f.nodisp.map(d => `<span class="chip ch">${esc(cap(fechaCorta(d)))}<button data-act="quitarND" data-d="${d}" aria-label="Quitar ${esc(fechaCorta(d))}">✕</button></span>`).join('') : '<span class="apoyo">Ninguna.</span>'}</div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:8px"><input type="date" data-f="nuevaFecha" value="${esc(f.nuevaFecha)}" aria-label="Fecha en que no puede"><button class="btn" data-act="addND">Agregar fecha</button></div></div>`,
    `<button class="btn pri" data-act="guardarSrv">Guardar</button>${f.id ? '<button class="btn peligro" data-act="borrarSrv">Quitar</button>' : '<button class="btn" data-act="cerrar">Cancelar</button>'}`, null, mant);
}
function guardarSrv() {
  const f = ui.form, nombre = (f.nombre || '').trim();
  if (!nombre) return toast('Escribe el nombre.');
  if (S.servidores.some(s => s.id !== f.id && s.nombre.toLowerCase() === nombre.toLowerCase())) return toast('Ya hay alguien con ese nombre. Agrega la inicial del apellido.');
  let id = f.id;
  if (id) { Object.assign(srv(id), { nombre, activo: f.activo, areas: f.areas }); }
  else { id = uid('s'); S.servidores.push({ id, nombre, activo: f.activo, areas: f.areas }); }
  S.nodisp = S.nodisp.filter(n => n.s !== id).concat(f.nodisp.map(d => ({ s: id, f: d })));
  touch(); cerrar(); render(); toast('Guardado.');
}
function borrarSrv() {
  const s = srv(ui.form.id);
  if (!confirm('¿Quitar a ' + s.nombre + ' de la lista? Se le quitarán también sus asignaciones. Si solo va a descansar, mejor desmarca “Está sirviendo actualmente”.')) return;
  S.servidores = S.servidores.filter(x => x.id !== s.id);
  S.nodisp = S.nodisp.filter(n => n.s !== s.id);
  for (const k of Object.keys(S.asig)) { S.asig[k] = S.asig[k].filter(id => id !== s.id); if (!S.asig[k].length) delete S.asig[k]; }
  touch(); cerrar(); render(); toast('Servidor quitado.');
}
function vaciarSrv() {
  if (!confirm('¿Quitar a TODOS los servidores? Se borran también todas las asignaciones del calendario. Las reuniones y las áreas se mantienen.')) return;
  if (!confirm('Última confirmación: esto no se puede deshacer. ¿Seguro?')) return;
  S.servidores = []; S.nodisp = []; S.asig = {};
  touch(); render(); toast('Lista vacía. Ya puedes agregar a tu gente.');
}

/* --- áreas --- */
function formArea(id) {
  const a = id ? area(id) : null;
  ui.kind = 'area';
  ui.form = a ? { id: a.id, nombre: a.nombre, vista: a.vista, cupo: String(a.cupo) } : { id: null, nombre: '', vista: ui.vista, cupo: '1', incluir: true };
  const f = ui.form;
  abrir(a ? 'Editar área' : 'Agregar área', `
    <div class="campo"><label for="a-nombre">Nombre del área</label><input id="a-nombre" type="text" data-f="nombre" value="${esc(f.nombre)}"></div>
    <div class="campo"><label for="a-vista">¿En qué calendario aparece?</label><select id="a-vista" data-f="vista">${Object.entries(VISTAS).map(([k, v]) => `<option value="${k}"${f.vista === k ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="campo"><label for="a-cupo">Personas por reunión</label><select id="a-cupo" data-f="cupo">${[1, 2, 3, 4, 5, 6].map(n => `<option value="${n}"${String(f.cupo) === String(n) ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
    ${a ? '' : '<label class="rec"><input type="checkbox" data-f="incluir" checked> Agregarla también a las reuniones que ya existen</label>'}`,
    `<button class="btn pri" data-act="guardarArea">Guardar</button>${a ? '<button class="btn peligro" data-act="borrarArea">Eliminar área</button>' : '<button class="btn" data-act="cerrar">Cancelar</button>'}`);
}
function guardarArea() {
  const f = ui.form, nombre = (f.nombre || '').trim();
  if (!nombre) return toast('Escribe el nombre del área.');
  if (f.id) { Object.assign(area(f.id), { nombre, vista: f.vista, cupo: Number(f.cupo) }); }
  else {
    const id = uid('a');
    S.areas.push({ id, nombre, vista: f.vista, cupo: Number(f.cupo) });
    if (f.incluir) { S.tipos.forEach(t => t.areas.push(id)); S.reuniones.forEach(r => r.areas.push(id)); }
  }
  touch(); cerrar(); render(); toast('Guardado.');
}
function borrarArea() {
  const a = area(ui.form.id);
  if (!confirm('¿Eliminar el área “' + a.nombre + '”? Se quita de todas las reuniones, de la lista de cada servidor y de las asignaciones.')) return;
  S.areas = S.areas.filter(x => x.id !== a.id);
  S.servidores.forEach(s => { s.areas = s.areas.filter(x => x !== a.id); });
  S.tipos.forEach(t => { t.areas = t.areas.filter(x => x !== a.id); });
  S.reuniones.forEach(r => { r.areas = r.areas.filter(x => x !== a.id); });
  for (const k of Object.keys(S.asig)) if (k.endsWith('|' + a.id)) delete S.asig[k];
  touch(); cerrar(); render(); toast('Área eliminada.');
}
function mover(id, d) {
  const i = S.areas.findIndex(a => a.id === id), j = i + d;
  if (j < 0 || j >= S.areas.length) return;
  [S.areas[i], S.areas[j]] = [S.areas[j], S.areas[i]];
  touch(); render();
}

/* ---------- eventos ---------- */
const ACC = {
  tab: d => { ui.tab = d.t; render(); window.scrollTo(0, 0); },
  mes: d => { ui.mes = mesMas(ui.mes, Number(d.n)); render(); },
  vista: d => { ui.vista = d.v; render(); },
  salir: () => salir(),
  reintentar: () => { if (estado === 'conflicto') recargar(); else if (estado === 'error') { dirty = true; flush(); } },
  cerrar: () => cerrar(),
  // reunión
  nuevaReu: () => formReu(null), editReu: d => formReu(d.id), guardarReu, borrarReu,
  habituales: formHab, doHab,
  tog: (d, el) => { const l = ui.form.areas, i = l.indexOf(d.a); if (i >= 0) l.splice(i, 1); else l.push(d.a); el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', String(i < 0)); },
  // generar
  generar: formGenerar,
  doGenerar: () => { const modo = ui.form.modo; cerrar(); resultadoGenerar(generar(modo)); render(); },
  // compartir
  compartir: () => abrir('Compartir o imprimir', `<p class="apoyo">Se usa el calendario que estás viendo: ${ui.vista === 'servicio' ? 'Servicio' : 'Alabanza'}, ${tituloMes(ui.mes)}.</p>
      <button class="btn pri ancho" data-act="copiar">Copiar texto para WhatsApp</button>
      <button class="btn ancho" data-act="imprimir">Imprimir o guardar en PDF</button>`),
  copiar, imprimir,
  // asignar
  slot: d => { ui.slot = { r: d.r, a: d.a, todos: false }; pintarSlot(); },
  todosSlot: () => { ui.slot.todos = !ui.slot.todos; pintarSlot(true); },
  addSlot: d => {
    const k = ui.slot.r + '|' + ui.slot.a; (S.asig[k] = S.asig[k] || []).push(d.s);
    touch(); render();
    if (S.asig[k].length >= area(ui.slot.a).cupo) cerrar(); else pintarSlot(true);
  },
  quitarSlot: d => {
    const k = ui.slot.r + '|' + ui.slot.a; S.asig[k] = (S.asig[k] || []).filter(id => id !== d.s);
    if (!S.asig[k].length) delete S.asig[k];
    touch(); render(); pintarSlot(true);
  },
  // servidores
  nuevoSrv: () => formSrv(null), editSrv: d => formSrv(d.id), guardarSrv, borrarSrv, vaciarSrv,
  addND: () => { const f = ui.form; if (/^\d{4}-\d{2}-\d{2}$/.test(f.nuevaFecha) && !f.nodisp.includes(f.nuevaFecha)) { f.nodisp.push(f.nuevaFecha); f.nodisp.sort(); } f.nuevaFecha = ''; pintarFormSrv(true); },
  quitarND: d => { ui.form.nodisp = ui.form.nodisp.filter(x => x !== d.d); pintarFormSrv(true); },
  // áreas
  nuevaArea: () => formArea(null), editArea: d => formArea(d.id), guardarArea, borrarArea,
  subir: d => mover(d.id, -1), bajar: d => mover(d.id, 1)
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return cerrar();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACC[el.dataset.act]; if (fn) fn(el.dataset, el);
});
function alCambiar(e) {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; $('#lista').innerHTML = listaSrv(); return; }
  if (t.id === 'fa') { ui.fa = t.value; $('#lista').innerHTML = listaSrv(); return; }
  const k = t.dataset && t.dataset.f;
  if (!k || !ui.form) return;
  ui.form[k] = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'fecha') ui.form.fechaTocada = true;
  if (e.type === 'change' && k === 'tipoId' && ui.kind === 'reu') aplicarTipo();
}
document.addEventListener('input', alCambiar);
document.addEventListener('change', alCambiar);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) cerrar(); });
window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });
window.addEventListener('online', () => { if (dirty || estado === 'error') { dirty = true; flush(); } });

/* ---------- inicio ---------- */
(async function inicio() {
  $('#logo-l').src = LOGO;
  let c = null; try { c = localStorage.getItem('imrv_clave'); } catch (e) {}
  if (c) { try { await entrar(c, true); return; } catch (e) { /* clave vieja o sin conexión: pide la clave */ } }
  $('#login').hidden = false;
})();
</script>
